name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Info.plist

      - name: Build
        run: make zip

      - uses: actions/upload-artifact@v7
        with:
          name: HiddenToggle
          path: build/HiddenToggle.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/HiddenToggle.zip --title "$GITHUB_REF_NAME" --generate-notes
